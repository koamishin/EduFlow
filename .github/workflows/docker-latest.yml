name: Docker Latest Image

# Manual publisher for the pullable `latest` image the installer uses.
# Dispatch with push=false for a validate-only build, or push=true (default)
# to publish ghcr.io/koamishin/opensinop:latest and a sha-pinned tag.
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish to ghcr.io (false = validate build only)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-latest-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/koamishin/opensinop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish the latest image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=OpenSinop
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
